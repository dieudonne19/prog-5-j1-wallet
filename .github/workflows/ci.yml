name: CI

on:
  push:
    branches: [main, dev]

jobs:
  ci:
    strategy:
      matrix:
        node_version: [20.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.22.0
      - name: Set up Node.js versions ${{ matrix.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Lint code
        run: pnpm lint
